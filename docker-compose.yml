networks:
  vetdesk-site-net:
    driver: bridge

services:
  web:
    build: .
    container_name: vetdesk-site-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./media/videos:/srv/videos:ro
    networks:
      - vetdesk-site-net
    mem_limit: 128m
    cpus: "0.5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vetdesk-site-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - vetdesk-site-net
    depends_on:
      - web
